<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#C81D77" />
    <title>by Fabric — Saha Takip</title>

    <!-- App İkonları & PWA -->
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Web App Özellikleri -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="by Fabric" />

    <!-- Netlify Badge Zorla Gizleme -->
    <style>
      iframe[src*="netlify"],
      [data-netlify-deploy-id],
      .netlify-badge,
      #netlify-drawer-container,
      div[class*="netlify-drawer"],
      a[href*="netlify.com"][class*="badge"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAF9F6] text-stone-900 antialiased selection:bg-[#C81D77]/15 selection:text-[#C81D77]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Netlify Enjekte Ederse Anında DOM'dan Temizleyen Script -->
    <script>
      (function() {
        const removeNetlifyElements = () => {
          document.querySelectorAll('iframe, div, a').forEach(el => {
            if (
              el.innerText?.includes('Powered by Netlify') ||
              el.className?.toString().includes('netlify') ||
              el.id?.toString().includes('netlify')
            ) {
              el.remove();
            }
          });
        };
        window.addEventListener('DOMContentLoaded', removeNetlifyElements);
        window.addEventListener('load', removeNetlifyElements);
        const observer = new MutationObserver(removeNetlifyElements);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
